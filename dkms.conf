PACKAGE_NAME="medion-signium-keyboard"
PACKAGE_VERSION="1.2"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KVERSION=${kernelver} KDIR=/lib/modules/${kernelver}/build all"
BUILT_MODULE_NAME[0]="medion_kbd"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
